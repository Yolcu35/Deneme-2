name: Build CloudStream Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build plugin
        run: gradle SetFilmizle:make

      - name: Generate plugins.json
        run: gradle makePluginsJson

      - name: Prepare builds branch
        run: |
          mkdir -p /tmp/builds
          cp -r . /tmp/builds/source

      - name: Publish build
        run: |
          mkdir -p /tmp/publish

          find . -type f \( -name "*.cs3" -o -name "plugins.json" \) -exec cp {} /tmp/publish/ \;

          git fetch origin builds || true

          if git show-ref --verify --quiet refs/remotes/origin/builds; then
            git checkout -B builds origin/builds
          else
            git checkout --orphan builds
            git rm -rf . || true
          fi

          cp /tmp/publish/* . 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --cached --quiet || git commit -m "Build SetFilmizle plugin"

          git push origin builds
